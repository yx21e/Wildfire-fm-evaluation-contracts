version: 0.1
updated: "2026-06-11"
purpose: "Canonical grid definitions and alignment rules."

grids:
  firewxfm_ca_5km_epsg5070:
    description: "Current FireWx-FM California regional wildfire prediction grid."
    crs: "EPSG:5070"
    resolution: "5 km"
    extent: "California regional domain used by FireWx-FM"
    current_firewxfm: true
    primary_use:
      - "wildfire_active_fire_occupancy"
      - "wildfire_fixed_contract_evaluation"
    regridding:
      dynamic_fields: "source-specific interpolation to EPSG:5070"
      static_fields: "raster reprojection/resampling to EPSG:5070"
      point_labels: "map points to containing grid cell"
      polygon_labels: "rasterize with observation mask"
    notes: "Do not treat missing perimeter snapshots as negative labels."

  conus_equal_area_5km_epsg5070:
    description: "Candidate general CONUS equal-area grid for gridded hazard tasks."
    crs: "EPSG:5070"
    resolution: "5 km"
    extent: "CONUS"
    current_firewxfm: false
    primary_use:
      - "wildfire"
      - "smoke"
      - "drought"
      - "heat"
    regridding:
      dynamic_fields: "conservative or bilinear by variable type"
      static_fields: "nearest for categorical, average/bilinear for continuous"
      point_labels: "cell assignment plus optional kernel aggregation"
      polygon_labels: "area-weighted rasterization"
    notes: "Recommended first general-HazardWx-FM grid because it can cover fire, smoke, heat, and drought without a lat/lon area distortion penalty."

  conus_latlon_025deg:
    description: "Coarse CONUS latitude/longitude grid for weather-derived pilots."
    crs: "EPSG:4326"
    resolution: "0.25 degree"
    extent: "CONUS"
    current_firewxfm: false
    primary_use:
      - "heat"
      - "drought"
      - "weather_pretraining"
    regridding:
      dynamic_fields: "native weather interpolation or nearest neighbor for pilots"
      static_fields: "resample from provider grids"
      point_labels: "cell assignment"
      polygon_labels: "area-weighted rasterization"
    notes: "Useful for fast pilots and compatibility with MERRA-like fields, but not ideal for final high-resolution wildfire outputs."

  station_point:
    description: "Point geometry for station-based observations."
    crs: "EPSG:4326"
    resolution: "point"
    extent: "provider station network"
    current_firewxfm: false
    primary_use:
      - "pm25_station_regression"
    regridding:
      dynamic_fields: "sample gridded covariates at station location"
      static_fields: "sample static context at station location"
      point_labels: "native station observation"
      polygon_labels: "not_applicable"
    notes: "Do not force station observations into gridded maps unless a separate gridding task is defined."

  track_point:
    description: "Object/track representation for cyclone data."
    crs: "EPSG:4326"
    resolution: "track point"
    extent: "basin dependent"
    current_firewxfm: false
    primary_use:
      - "cyclone_track"
      - "cyclone_intensity"
    regridding:
      dynamic_fields: "sample gridded fields around storm center"
      static_fields: "optional basin/landmask context"
      point_labels: "native track point"
      polygon_labels: "not_applicable"
    notes: "Keep raw track tables native; derive storm-centered tensors only in adapter caches."

  event_context:
    description: "Task-native event representation for event-level wildfire outcomes."
    crs: "task_native"
    resolution: "event"
    extent: "event dependent"
    current_firewxfm: false
    primary_use:
      - "wildfire_final_area"
      - "wildfire_analog_retrieval"
    regridding:
      dynamic_fields: "summarize gridded covariates over the event context window"
      static_fields: "summarize static context over the event footprint or context window"
      point_labels: "event metadata"
      polygon_labels: "event-level aggregation"
    notes: "Use this only when the prediction unit is an event, not a dense grid cell."

  task_dependent:
    description: "Explicit placeholder for multi-task pilot splits whose samples keep task-native geometry."
    crs: "task_native"
    resolution: "task dependent"
    extent: "task dependent"
    current_firewxfm: false
    primary_use:
      - "multi_task_pilot"
    regridding:
      dynamic_fields: "defined by each task adapter"
      static_fields: "defined by each task adapter"
      point_labels: "defined by each task adapter"
      polygon_labels: "defined by each task adapter"
    notes: "Adapters must resolve this to a concrete task grid before training."
